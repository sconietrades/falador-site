<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falador Capital</title>
    <meta name="description" content="Falador Capital is a digital asset trading and credit firm specialising in market neutral strategies and overcollateralised lending to institutional counterparties.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            padding: 24px 28px;
        }

        .logo {
            display: inline-block;
            border: 2px solid #000000;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: #000000;
        }

        main {
            margin-top: 48px;
            max-width: 800px;
        }

        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 16px;
        }

        .description {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .description strong {
            font-weight: 700;
        }

        hr {
            border: none;
            border-top: 2px solid #000000;
            max-width: 800px;
        }

        footer {
            margin-top: auto;
            font-size: 14px;
            color: #000000;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .description {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">Falador Capital</a>
    </header>

    <main>
        <h1>Falador Capital is a digital asset trading and credit firm.</h1>
        <p class="description">
            We specialise in <strong>market neutral strategies</strong> and <strong>overcollateralised lending</strong> to leading digital asset institutions.
        </p>
        <hr>
    </main>

    <footer>
        &copy; 2026 Falador Capital &mdash; All rights reserved.
    </footer>
</body>
</html>
